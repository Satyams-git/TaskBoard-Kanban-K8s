apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "taskboard.fullname" . }}-config
  labels:
    {{- include "taskboard.labels" . | nindent 4 }}
data:
  DB_HOST: {{ include "taskboard.fullname" . }}-mysql
  DB_PORT: "3306"
  DB_NAME: {{ .Values.config.dbName | quote }}
  DB_USER: {{ .Values.config.dbUser | quote }}
  APP_ENV: {{ .Values.config.appEnv | quote }}
  MYSQL_DATABASE: {{ .Values.config.dbName | quote }}
  MYSQL_USER: {{ .Values.config.dbUser | quote }}
