{{- if .Values.logAgent.enabled -}}
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ include "taskboard.fullname" . }}-log-agent
  labels:
    {{- include "taskboard.labels" . | nindent 4 }}
    {{- include "taskboard.selectorLabels" (dict "ctx" . "component" "log-agent") | nindent 4 }}
spec:
  selector:
    matchLabels:
      {{- include "taskboard.selectorLabels" (dict "ctx" . "component" "log-agent") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "taskboard.labels" . | nindent 8 }}
        {{- include "taskboard.selectorLabels" (dict "ctx" . "component" "log-agent") | nindent 8 }}
    spec:
      tolerations:
      - key: node-role.kubernetes.io/control-plane
        operator: Exists
        effect: NoSchedule
      containers:
      - name: log-agent
        image: busybox:1.37
        command:
        - sh
        - -c
        - |
          while true; do
            lines=$(cat /var/log/containers/*{{ .Release.Name }}*.log 2>/dev/null | wc -l)
            echo "[log-agent] node=$NODE_NAME {{ .Release.Name }} log lines=$lines"
            sleep 30
          done
        env:
        - name: NODE_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
        resources:
          requests:
            cpu: 10m
            memory: 16Mi
          limits:
            cpu: 50m
            memory: 32Mi
        volumeMounts:
        - name: varlog
          mountPath: /var/log
          readOnly: true
      volumes:
      - name: varlog
        hostPath:
          path: /var/log
{{- end }}
