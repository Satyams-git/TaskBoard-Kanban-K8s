apiVersion: v1
kind: Secret
metadata:
  name: {{ include "taskboard.fullname" . }}-db-secret
  labels:
    {{- include "taskboard.labels" . | nindent 4 }}
type: Opaque
stringData:
  MYSQL_ROOT_PASSWORD: {{ required "Set secrets.mysqlRootPassword (--set secrets.mysqlRootPassword=...)" .Values.secrets.mysqlRootPassword | quote }}
  MYSQL_PASSWORD: {{ required "Set secrets.mysqlPassword (--set secrets.mysqlPassword=...)" .Values.secrets.mysqlPassword | quote }}
