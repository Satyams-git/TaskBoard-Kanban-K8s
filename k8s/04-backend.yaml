# Modules 3, 4, 6, 10: backend API Deployment + ClusterIP Service
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: taskboard-backend
  namespace: taskboard
  labels:
    app.kubernetes.io/name: backend
    app.kubernetes.io/part-of: taskboard
spec:
  replicas: 2
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: backend
        app.kubernetes.io/part-of: taskboard
    spec:
      # Module 10: try to keep the two replicas on different nodes
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              topologyKey: kubernetes.io/hostname
              labelSelector:
                matchLabels:
                  app.kubernetes.io/name: backend
      containers:
      - name: backend
        image: YOUR_DOCKERHUB_USER/taskboard-backend:v1
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 5000
        # Module 6: all ConfigMap keys become env vars, the password comes from the Secret
        envFrom:
        - configMapRef:
            name: taskboard-config
        env:
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: taskboard-db-secret
              key: MYSQL_PASSWORD
        # Downward API: the UI footer shows which pod and node answered
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: NODE_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 256Mi
        readinessProbe:
          httpGet:
            path: /api/ready
            port: http
          initialDelaySeconds: 5
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /api/health
            port: http
          initialDelaySeconds: 10
          periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: taskboard-backend
  namespace: taskboard
  labels:
    app.kubernetes.io/name: backend
    app.kubernetes.io/part-of: taskboard
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: backend
  ports:
  - name: http
    port: 5000
    targetPort: http
