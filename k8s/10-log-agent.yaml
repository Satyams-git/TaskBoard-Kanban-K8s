# Module 9: one log-agent pod on EVERY node (masters too) reading the node's container logs
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: taskboard-log-agent
  namespace: taskboard
  labels:
    app.kubernetes.io/name: log-agent
    app.kubernetes.io/part-of: taskboard
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: log-agent
  template:
    metadata:
      labels:
        app.kubernetes.io/name: log-agent
        app.kubernetes.io/part-of: taskboard
    spec:
      # Module 10: tolerate the control-plane taint so the agent also runs on the master
      tolerations:
      - key: node-role.kubernetes.io/control-plane
        operator: Exists
        effect: NoSchedule
      containers:
      - name: log-agent
        image: busybox:1.37
        command:
        - sh
        - -c
        - |
          while true; do
            lines=$(cat /var/log/containers/*taskboard*.log 2>/dev/null | wc -l)
            echo "[log-agent] node=$NODE_NAME taskboard log lines=$lines"
            sleep 30
          done
        env:
        - name: NODE_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
        resources:
          requests:
            cpu: 10m
            memory: 16Mi
          limits:
            cpu: 50m
            memory: 32Mi
        volumeMounts:
        - name: varlog
          mountPath: /var/log
          readOnly: true
      volumes:
      - name: varlog
        hostPath:
          path: /var/log
