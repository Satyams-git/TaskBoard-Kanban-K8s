# Production practice: keep at least 1 backend pod running during node drains
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: taskboard-backend
  namespace: taskboard
  labels:
    app.kubernetes.io/part-of: taskboard
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: backend
