# Module 6: passwords. stringData is plain text here; Kubernetes stores it base64-encoded.
# base64 is NOT encryption. In real projects, never commit real passwords to Git.
apiVersion: v1
kind: Secret
metadata:
  name: taskboard-db-secret
  namespace: taskboard
  labels:
    app.kubernetes.io/part-of: taskboard
type: Opaque
stringData:
  MYSQL_ROOT_PASSWORD: Root-Pass-2026
  MYSQL_PASSWORD: TaskBoard-Pass-2026
