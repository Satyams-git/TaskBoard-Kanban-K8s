# Modules 3, 4: frontend (nginx) Deployment + NodePort Service
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: taskboard-frontend
  namespace: taskboard
  labels:
    app.kubernetes.io/name: frontend
    app.kubernetes.io/part-of: taskboard
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: frontend
        app.kubernetes.io/part-of: taskboard
    spec:
      containers:
      - name: frontend
        image: YOUR_DOCKERHUB_USER/taskboard-frontend:v1
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 8080
        env:
        # Full DNS name: nginx does not use the search domains of resolv.conf
        - name: BACKEND_URL
          value: http://taskboard-backend.taskboard.svc.cluster.local:5000
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 200m
            memory: 128Mi
        readinessProbe:
          httpGet:
            path: /healthz
            port: http
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /healthz
            port: http
          initialDelaySeconds: 10
          periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: taskboard-frontend
  namespace: taskboard
  labels:
    app.kubernetes.io/name: frontend
    app.kubernetes.io/part-of: taskboard
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: frontend
  ports:
  - name: http
    port: 80
    targetPort: http
    nodePort: 30080
