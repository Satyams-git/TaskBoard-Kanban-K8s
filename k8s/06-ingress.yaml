# Module 5: one entry point. "/" goes to the frontend, "/api" goes straight to the backend.
# Needs an Ingress controller (Traefik from Module 5).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: taskboard
  namespace: taskboard
  labels:
    app.kubernetes.io/part-of: taskboard
spec:
  ingressClassName: traefik
  rules:
  - http:
      paths:
      - path: /api
        pathType: Prefix
        backend:
          service:
            name: taskboard-backend
            port:
              number: 5000
      - path: /
        pathType: Prefix
        backend:
          service:
            name: taskboard-frontend
            port:
              number: 80
