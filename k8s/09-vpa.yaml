# Module 11 (optional): VPA in "Off" mode only RECOMMENDS sizes for MySQL, it changes nothing.
# Needs the VPA components installed (Module 11).
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: taskboard-mysql
  namespace: taskboard
  labels:
    app.kubernetes.io/part-of: taskboard
spec:
  targetRef:
    apiVersion: apps/v1
    kind: StatefulSet
    name: taskboard-mysql
  updatePolicy:
    updateMode: "Off"
