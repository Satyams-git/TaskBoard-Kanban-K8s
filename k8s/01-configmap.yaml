# Module 6: non-secret settings for MySQL and the backend
apiVersion: v1
kind: ConfigMap
metadata:
  name: taskboard-config
  namespace: taskboard
  labels:
    app.kubernetes.io/part-of: taskboard
data:
  # Used by the backend
  DB_HOST: taskboard-mysql
  DB_PORT: "3306"
  DB_NAME: taskboard
  DB_USER: taskboard
  APP_ENV: kind-dev
  # Used by the MySQL image on first start
  MYSQL_DATABASE: taskboard
  MYSQL_USER: taskboard
